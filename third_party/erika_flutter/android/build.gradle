group = "dev.aimesoft.erika_flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "dev.aimesoft.erika_flutter"
    compileSdk = 36

    defaultConfig {
        minSdk = 26
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "androidx.lifecycle:lifecycle-common:2.8.7"
    testImplementation "junit:junit:4.13.2"
    // android.jar ships throwing org.json stubs for local JVM tests. Use the
    // real implementation so NativeJson tests exercise the production decoder.
    testImplementation "org.json:json:20180813"
}

apply from: "erika-native.gradle"
